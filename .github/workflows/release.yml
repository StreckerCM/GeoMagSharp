name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g., beta.1, rc.1). Leave empty for stable release.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.ref_type }}" -eq "tag") {
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
        } else {
          # Manual dispatch - read from Directory.Build.props
          [xml]$props = Get-Content "Directory.Build.props"
          $prefix = $props.Project.PropertyGroup.VersionPrefix
          $suffix = "${{ github.event.inputs.version_suffix }}"
          if ($suffix) {
            $version = "$prefix-$suffix"
          } else {
            $version = $prefix
          }
        }
        Write-Host "Version: $version"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal

    - name: Pack
      run: dotnet pack src/GeoMagSharp/GeoMagSharp.csproj -c Release --no-build -o artifacts /p:PackageVersion=${{ steps.version.outputs.VERSION }}

    - name: Push to NuGet.org
      if: github.ref_type == 'tag'
      shell: pwsh
      run: |
        $pkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
        dotnet nuget push $pkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      if: github.ref_type == 'tag'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $pkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
        $args = @("release", "create", "v$version", $pkg.FullName, "--title", "GeoMagSharp $version", "--generate-notes")
        if ($version -match '-') { $args += "--prerelease" }
        & gh @args

    - name: Upload NuGet artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ steps.version.outputs.VERSION }}
        path: artifacts/*.nupkg
        retention-days: 90
